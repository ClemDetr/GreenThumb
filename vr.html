<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Thumb</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>
<body>
    <script>
        AFRAME.registerComponent('growable', {
      schema: {
        from:     { type: 'vec3',   default: { x: 0.5, y: 0.5, z: 0.5 } },
        to:       { type: 'vec3',   default: { x: 1.8, y: 1.8, z: 1.8 } },
        dur:      { type: 'number', default: 3000 },
        easing:   { type: 'string', default: 'easeOutQuad' },
        once:     { type: 'boolean', default: true }
      },

      init: function () {
        const el = this.el;
        const data = this.data;
        this.growing = false;
        this.hasGrown = false;

        this.onClick = () => {
          if (this.growing || (data.once && this.hasGrown)) return;
          this.growing = true;

          el.setAttribute('scale', data.from);
          
          el.setAttribute('animation__grow', {
            property: 'scale',
            from: `${data.from.x} ${data.from.y} ${data.from.z}`,
            to:   `${data.to.x} ${data.to.y} ${data.to.z}`,
            dur: data.dur,
            easing: data.easing,
            loop: false
          });
        };

        this.onComplete = () => {
          this.growing = false;
          this.hasGrown = true;
        };

        el.addEventListener('click', this.onClick);
        el.addEventListener('animationcomplete__grow', this.onComplete);
      },

      remove: function () {
        this.el.removeEventListener('click', this.onClick);
        this.el.removeEventListener('animationcomplete__grow', this.onComplete);
    }
    });
    </script>
    <a-scene stats>
        <a-assets>
            <a-asset-item id="glasshouse" src="assets/serre.glb"></a-asset-item>
            <a-asset-item id="outside" src="assets/outside.glb"></a-asset-item>
            <a-asset-item id="flower1" src="assets/flower1.glb"></a-asset-item>
            <a-asset-item id="flower2" src="assets/flower2.glb"></a-asset-item>
            <a-asset-item id="plant1" src="assets/plant1.glb"></a-asset-item>
            <a-asset-item id="plant2" src="assets/plant2.glb"></a-asset-item>
            <a-asset-item id="tree1" src="assets/tree1.glb"></a-asset-item>
            
        </a-assets>

        <a-camera>
          <a-entity id="curseur" cursor="fuse:true; fuseTimeout:1500" position="0 0 -0.3" geometry="primitive:sphere; radius:0.01" material="color: black; shader: flat; opacity: 0.5"></a-entity>
        </a-camera>

        <a-entity gltf-model="#glasshouse" position="0 0 0" scale="0.9 0.9 0.9" rotation="0 90 0">
          <a-entity gltf-model="#plant2" position="-0.235 0.348 -2.829" scale="0.5 0.5 0.5" growable></a-entity>
          <a-entity gltf-model="#plant2" position="-3.856 0.365 2.749" scale="0.5 0.5 0.5" growable></a-entity>
          <a-entity gltf-model="#plant1" position="-2.313 1.469 -3.813" scale="0.5 0.5 0.5" rotation="0 -174 0" growable></a-entity>
          <a-entity gltf-model="#flower1" position="3.927 0.483 -3.984" scale="0.5 0.5 0.5" growable></a-entity>
          <a-entity gltf-model="#flower2" position="0.696 1.528 -3.796" scale="0.5 0.5 0.5" growable></a-entity>
          <a-entity gltf-model="#flower2" position="-3.584 1.449 -3.559" scale="0.5 0.5 0.5" growable></a-entity>
          <a-entity gltf-model="#tree1" position="4.154 0.358 3.715" scale="0.5 0.5 0.5" rotation="0 -84 0" growable></a-entity>
        </a-entity>
        <a-entity gltf-model="#outside" position="0 0 0" scale="0.9 0.9 0.9" rotation="0 90 0"></a-entity>
        <a-sky color="blue"></a-sky>
    </a-scene>
    
</body>
</html>
