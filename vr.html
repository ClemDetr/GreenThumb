<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Thumb</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>
<body>
    <script>
        AFRAME.registerComponent('growable', {
      schema: {
        from:     { type: 'vec3',   default: { x: 0.5, y: 0.5, z: 0.5 } },
        to:       { type: 'vec3',   default: { x: 2, y: 2, z: 2 } },
        dur:      { type: 'number', default: 3000 },
        easing:   { type: 'string', default: 'easeOutQuad' },
        once:     { type: 'boolean', default: true }
      },

      init: function () {
        const el = this.el;
        const data = this.data;
        this.growing = false;
        this.hasGrown = false;

        this.onClick = () => {
          if (this.growing || (data.once && this.hasGrown)) return;
          this.growing = true;

          el.setAttribute('scale', data.from);
          
          el.setAttribute('animation__grow', {
            property: 'scale',
            from: `${data.from.x} ${data.from.y} ${data.from.z}`,
            to:   `${data.to.x} ${data.to.y} ${data.to.z}`,
            dur: data.dur,
            easing: data.easing,
            loop: false
          });
        };

        this.onComplete = () => {
          this.growing = false;
          this.hasGrown = true;
        };

        el.addEventListener('click', this.onClick);
        el.addEventListener('animationcomplete__grow', this.onComplete);
      },

      remove: function () {
        this.el.removeEventListener('click', this.onClick);
        this.el.removeEventListener('animationcomplete__grow', this.onComplete);
    }
    });
    </script>
    <a-scene stats>
        <a-assets>
            <a-asset-item id="glasshouse" src="assets/VRexp26.glb"></a-asset-item>
            <a-asset-item id="plant2" src="assets/plant2.glb"></a-asset-item>
            <a-asset-item id="flower1" src="assets/flower1.glb"></a-asset-item>
            <a-asset-item id="pot1" src="assets/pot1.glb"></a-asset-item>
        </a-assets>

        <a-camera>
          <a-entity id="curseur" cursor="fuse:true; fuseTimeout:2000" position="0 0 -1" geometry="primitive:sphere; radius:0.01" material="color: black; shader: flat; opacity: 0.5"></a-entity>
        </a-camera>

        <a-entity gltf-model="#glasshouse" position="0 0 0" scale="1 1 1" rotation="0 90 0">
          <a-entity gltf-model="#pot1" position="2 0.1 -4" scale="0.5 0.5 0.5" >
            <a-entity gltf-model="#plant2" position="0 0.5 0" scale="0.5 0.5 0.5" growable></a-entity>
          </a-entity>
        </a-entity>

    </a-scene>
    
</body>
</html>
